name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 25.1.8937393
          cmake-version: 3.22.1

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          sdk.dir=$ANDROID_SDK_ROOT
          ndk.dir=$ANDROID_SDK_ROOT/ndk/25.1.8937393
          cmake.dir=$ANDROID_SDK_ROOT/cmake/3.22.1
          EOF
          cat local.properties

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug -v

      - name: Check for APK
        run: |
          echo "=== Checking for APK files ==="
          find . -name "*.apk" -type f
          APK_COUNT=$(find . -name "*.apk" -type f | wc -l)
          echo "APK count: $APK_COUNT"
          if [ $APK_COUNT -eq 0 ]; then
            echo "ERROR: No APK file generated!"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: 'app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
