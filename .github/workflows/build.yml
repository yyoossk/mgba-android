name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK / CMake
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12212155
        run: |
          set -o pipefail
          echo "=== Checking for pre-installed NDK ===" | tee setup.log
          ls -la $ANDROID_SDK_ROOT/ndk/ 2>&1 | tee -a setup.log || echo "NDK directory not found yet" | tee -a setup.log

          # Install only CMake - let AGP handle NDK
          echo "=== Installing CMake ===" | tee -a setup.log
          yes | sdkmanager "cmake;3.22.1" 2>&1 | tee -a setup.log || echo "CMake install attempt completed" | tee -a setup.log

          # Try to install NDK using latest available
          echo "=== Attempting NDK install ===" | tee -a setup.log
          yes | sdkmanager "ndk-bundle" 2>&1 | tail -20 | tee -a setup.log || echo "NDK bundle not available" | tee -a setup.log

          echo "=== Final NDK check ===" | tee -a setup.log
          find $ANDROID_SDK_ROOT -name "ndk-*" -type d 2>/dev/null | head -5 | tee -a setup.log || echo "No NDK directories found" | tee -a setup.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          echo "=== Environment variables ===" | tee build.log
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" | tee -a build.log
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" | tee -a build.log
          echo "JAVA_HOME=$JAVA_HOME" | tee -a build.log
          echo "PATH=$PATH" | tee -a build.log

          echo "=== SDK/NDK verification ===" | tee -a build.log
          ls -la $ANDROID_SDK_ROOT/platforms/ 2>&1 | head -10 | tee -a build.log
          ls -la $ANDROID_SDK_ROOT/ndk/ 2>&1 | tee -a build.log

          echo "=== Starting Gradle build ===" | tee -a build.log
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee -a build.log
          BUILD_EXIT=$?
          echo "=== Gradle exit code: $BUILD_EXIT ===" | tee -a build.log

          # APK 確認
          echo "=== APK generation check ===" | tee -a build.log
          find app/build/outputs -name "*.apk" 2>/dev/null | tee -a build.log || echo "No APK found" | tee -a build.log

          exit $BUILD_EXIT

      - name: Show build result
        if: always()
        run: |
          echo "=== CMake build status ==="
          ls -la app/build/intermediates/cmake/ 2>/dev/null || echo "No CMake intermediates found"
          echo "=== Looking for CMake errors ==="
          grep -i "error\|failed" build.log | head -20 || echo "No error patterns found in build.log"
          echo "=== Checking for APK files ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Tail of build.log ==="
          tail -100 build.log

      - name: Check APK location
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== Build directory structure ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No build/outputs directory"
          echo "=== Full app/build structure ==="
          find app/build -type d 2>/dev/null | head -30

      - name: Upload Setup Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setup-log
          path: setup.log
          if-no-files-found: ignore

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload build directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-directory
          path: 'app/build/'
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: ignore
