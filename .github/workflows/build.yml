name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build APK

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Setup Gradle Wrapper
        run: |
          echo "Generating Gradle Wrapper..."
          gradle wrapper --gradle-version 8.4 --no-daemon || echo "Wrapper generation attempted"

      - name: Verify project setup
        run: |
          echo "=== Java Version ==="
          java -version
          echo ""
          echo "=== Gradle Version ==="
          gradle --version
          echo ""
          echo "=== Gradle Wrapper Status ==="
          if [ -f "gradlew" ]; then
            echo "Gradle wrapper exists"
            ls -lh gradlew gradle-wrapper.jar
          else
            echo "Gradle wrapper NOT found"
          fi
          echo ""
          echo "=== Project Structure ==="
          ls -la

      - name: Build with Gradle
        env:
          GRADLE_OPTS: "-Xmx2048m"
        run: |
          gradle --version
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.log || true

      - name: Display build output
        if: always()
        run: |
          echo "=== Build Output ==="
          cat build_output.log
          echo "=== End Build Output ==="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
