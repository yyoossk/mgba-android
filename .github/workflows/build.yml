name: Build mGBA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: yyoossk/android-build-env/.github/workflows/android-build.yml@main
    with:
      ndk-version: '27.0.12077973'
      cmake-version: '3.22.1'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk-out

      - name: Locate APK
        id: find
        run: |
          APK=$(find apk-out -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; find apk-out; exit 1; fi
          mkdir -p release && cp "$APK" release/mgba-emulator.apk
          echo "tag=apk-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release with raw APK (REST API)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REL=$(gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
            -f name="mGBA APK $TAG" -f body="Commit: ${{ github.sha }}" \
            --jq '.id')
          UPLOAD_URL="https://uploads.github.com/repos/$REPO/releases/$REL/assets?name=mgba-emulator.apk"
          curl -sSf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @release/mgba-emulator.apk "$UPLOAD_URL" > /dev/null
          echo "Release: https://github.com/$REPO/releases/tag/$TAG"
          echo "Direct APK: https://github.com/$REPO/releases/download/$TAG/mgba-emulator.apk"
