name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK / CMake
        env:
          NDK: '25.1.8937393'
          CMAKE: '3.22.1'
        run: |
          pkgs=()
          [ -n "$NDK" ] && pkgs+=("ndk;$NDK")
          [ -n "$CMAKE" ] && pkgs+=("cmake;$CMAKE")
          yes | sdkmanager "${pkgs[@]}" > /dev/null
          if [ -n "$NDK" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log && echo "=== BUILD COMPLETE ===" && tail -100 build.log

      - name: Check APK location
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== Build directory structure ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No build/outputs directory"
          echo "=== Full app/build structure ==="
          find app/build -type d 2>/dev/null | head -30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload build directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-directory
          path: 'app/build/'
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: ignore
