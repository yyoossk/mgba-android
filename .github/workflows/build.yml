name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'
          cache-disabled: false

      - name: Show Environment
        run: |
          echo "=== Environment ==="
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          echo ""
          echo "=== Java version ==="
          java -version
          echo ""
          echo "=== Gradle version ==="
          gradle --version
          echo ""
          echo "=== Android SDK contents ==="
          ls -la "$ANDROID_SDK_ROOT/" | head -20

      - name: Create gradle.properties
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug -v 2>&1 | tee build.log || true

      - name: Check for APK
        if: always()
        run: |
          echo "=== APK Search ==="
          find . -name "*.apk" -type f | tee apk-files.txt || true
          if [ ! -s apk-files.txt ]; then
            echo "ERROR: No APK files found"
            echo ""
            echo "=== Build Log (last 200 lines) ==="
            tail -200 build.log || true
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build.log
            apk-files.txt
            app/build/outputs/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
