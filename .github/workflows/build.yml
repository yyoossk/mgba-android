name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    uses: yyoossk/android-build-env/.github/workflows/android-build.yml@main
    with:
      ndk-version: '25.1.8937393'
      cmake-version: '3.22.1'
      gradle-version: '8.7'
      java-version: '17'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./apk-artifact

      - name: Prepare APK for release
        run: |
          echo "=== Contents of apk-artifact ==="
          find ./apk-artifact -type f | head -20
          echo "=== Finding APK files ==="
          APK_FILES=$(find ./apk-artifact -name "*.apk" -type f)
          if [ -z "$APK_FILES" ]; then
            echo "APK not found in artifact"
            exit 1
          fi
          APK_FILE=$(echo "$APK_FILES" | head -1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" ./app-release.apk
          ls -lh ./app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./app-release.apk
          tag_name: apk-${{ github.run_number }}
          name: "APK Build #${{ github.run_number }}"
          body: |
            自動生成: mGBA Android APK

            Ref: ${{ github.ref }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
