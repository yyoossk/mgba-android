name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK / CMake
        env:
          NDK: '27.0.12212155'
          CMAKE: '3.22.1'
        run: |
          set -o pipefail
          echo "=== Android SDK Path ===" | tee -a setup.log
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT" | tee -a setup.log
          echo "=== Listing available NDK versions ===" | tee -a setup.log
          sdkmanager --list 2>&1 | grep -i ndk | tee -a setup.log || echo "No NDK versions found in list" | tee -a setup.log
          echo "=== Installing packages ===" | tee -a setup.log
          pkgs=()
          [ -n "$NDK" ] && pkgs+=("ndk;$NDK")
          [ -n "$CMAKE" ] && pkgs+=("cmake;$CMAKE")
          echo "Packages to install: ${pkgs[@]}" | tee -a setup.log
          if ! yes | sdkmanager "${pkgs[@]}" 2>&1 | tee -a setup.log; then
            echo "ERROR: sdkmanager failed" | tee -a setup.log
            exit 1
          fi
          if [ -n "$NDK" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"
            echo "=== Verifying NDK installation ===" | tee -a setup.log
            ls -la "$ANDROID_SDK_ROOT/ndk/" 2>&1 | tee -a setup.log || echo "NDK directory not found" | tee -a setup.log
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --stacktrace -x lint 2>&1 | tee build.log

      - name: Show build result
        if: always()
        run: |
          echo "=== Gradle command exit code: $?"
          echo "=== Checking for APK files ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Tail of build.log ==="
          tail -50 build.log

      - name: Check APK location
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo "=== Build directory structure ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No build/outputs directory"
          echo "=== Full app/build structure ==="
          find app/build -type d 2>/dev/null | head -30

      - name: Upload Setup Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setup-log
          path: setup.log
          if-no-files-found: ignore

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload build directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-directory
          path: 'app/build/'
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: ignore
