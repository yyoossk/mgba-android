name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    uses: yyoossk/android-build-env/.github/workflows/android-build.yml@main
    with:
      ndk-version: '25.1.8937393'
      cmake-version: '3.22.1'
      gradle-version: '8.7'
      java-version: '17'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./apk-artifact

      - name: Prepare APK for release
        run: |
          echo "=== Contents of apk-artifact ==="
          find ./apk-artifact -type f | head -20
          echo "=== Finding APK files ==="
          APK_FILES=$(find ./apk-artifact -name "*.apk" -type f)
          if [ -z "$APK_FILES" ]; then
            echo "APK not found in artifact"
            exit 1
          fi
          APK_FILE=$(echo "$APK_FILES" | head -1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" ./app-release.apk
          ls -lh ./app-release.apk

      - name: Create GitHub Release
        run: |
          TAG_NAME="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG_NAME" ./app-release.apk \
            --title "Build #${{ github.run_number }} - APK Release" \
            --notes "ビルド成功: ${{ github.ref }}
コミット: ${{ github.sha }}
ビルド日時: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            --draft=false \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
