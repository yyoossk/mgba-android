name: Build mGBA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    uses: yyoossk/android-build-env/.github/workflows/android-build.yml@main
    with:
      ndk-version: '25.1.8937393'
      cmake-version: '3.22.1'
      gradle-version: '8.7'
      java-version: '17'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: ./apk-artifact

      - name: Prepare APK for release
        run: |
          cd ./apk-artifact
          APK_FILE=$(ls -1 *.apk | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "APK not found in artifact"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" ../app-release.apk
          ls -lh ../app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./app-release.apk
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} - APK Release"
          body: |
            ビルド成功: ${{ github.ref }}
            コミット: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
